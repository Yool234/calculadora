<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <style>
        body{
            background-color: #2f2c79;
        }
    </style>


    <center>
        <br>
        <h4>CALCULADORA</h4>
        <br><br>

        <!--  Caja contenedor de elementos -->
        <div class="card p-3 shadow" style="max-width: 320px; background-color: black;">
            
             <!--pantalla de calculadora -->
        <input type="text" id="pantalla" class="form-control mb-3 text-end fs-3" placeholder="0"  readonly >

        <!--filas de botones -->
        <!--Fila 1 -->
        <div class="row" g-2 mb-2>
            <div class="col-3"><button class="btn btn-danger w-100" onclick="limpiar()"> ON </button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="limpiar()"> C </button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="borrar()"> CE </button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="agregar('/')"> / </button></div>
        </div> <br>

        <!--Fila 2 -->
        <div class="row" g-2 mb-2>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="agregar('7')"> 7 </button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="agregar('8')"> 8 </button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="agregar('9')"> 9 </button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="agregar('*')"> * </button></div>
        </div> <br>

        <!--Fila 3 -->
        <div class="row" g-2 mb-2>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="agregar('4')"> 4 </button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="agregar('5')"> 5 </button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="agregar('6')"> 6 </button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="agregar('-')"> - </button></div>
        </div> <br>
        

        <!--Fila 4 -->
        <div class="row" g-2 mb-2>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="agregar('1')"> 1 </button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="agregar('2')"> 2 </button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="agregar('3')"> 3 </button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="agregar('+')"> + </button></div>
        </div> <br>

         <!--Fila 5 -->
        <div class="row" g-2 mb-2>
            <div class="col-6"><button class="btn btn-secondary w-100" onclick="agregar('0')"> 0 </button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="agregar('.')"> . </button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="calcular('=')"> = </button></div>
        </div> <br>
        </div>
    </center>


    <script>
        function agregar(valor){
            document.getElementById('pantalla').value += valor;
        }

        function limpiar(){
            document.getElementById('pantalla').value = ' '; 
        }

        function borrar(){
            let textoactual = document.getElementById('pantalla').value;
            document.getElementById('pantalla').value = textoactual.slice(0,1);
        }

        function calcular(){
            let proceso = document.getElementById('pantalla').value;

            try{
                let resultado = eval(proceso);
                document.getElementById('pantalla').value = resultado;

            } catch(error){
                document.getElementById('pantalla').value = 'Syntax Error';
            }
        }




    </script>
    



</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
